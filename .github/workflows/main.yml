name: CI Ecowalk Backend

on:
  push:
    branches: [ "main" ]

jobs:
  # =========================================================
  # 1. QUALITY AND TEST JOB (Phân tích tĩnh, Test, Coverage, SCA)
  # =========================================================
  quality-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cấp quyền thực thi cho Gradlew
        run: chmod +x gradlew
        
      # Chạy Spotless để tự động format code
      - name: Run Spotless Apply
        run: ./gradlew spotlessApply
        
      # --- 1.1 Linter/Code Style (Checkstyle) ------------------
      - name: 🔍 Kiểm tra Code Style (Checkstyle)
        # Checkstyle là công cụ phổ biến để kiểm tra tuân thủ style cho Java
        run: ./gradlew checkstyleMain checkstyleTest
        # Gradle sẽ tự động tìm cấu hình Checkstyle trong build.gradle

      # --- 1.2 Unit/Integration Tests & Coverage (JaCoCo) ------
      - name: 🧪 Chạy Unit Tests và Tạo Code Coverage (JaCoCo)
        # Sử dụng lệnh Gradle để chạy test và tạo báo cáo JaCoCo
        run: ./gradlew clean test
        # JaCoCo sẽ tự động chạy trong task 'test' và tạo báo cáo

      # --- 1.3 SAST (Static Analysis - SpotBugs) ----------------
      - name: 🛡️ Phân tích Tĩnh SAST (SpotBugs)
        # SpotBugs tìm kiếm các lỗi lập trình tiềm ẩn (bugs) và điểm yếu (vulnerabilities)
        run: ./gradlew spotbugsMain
        # SpotBugs (kế thừa từ FindBugs) là một SAST tool rất mạnh cho Java

      # --- 1.4 SCA (Software Composition Analysis - Dependency-Check) ---
      - name: 🔗 Quét Lỗ hổng Thư viện (OWASP Dependency-Check)
        # Quét các thư viện JAR để tìm lỗ hổng đã biết (CVEs)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          # Thư mục build/dependency của Gradle thường là nơi chứa các file JAR cần quét
          scanPath: build/libs
          project: 'Ecowalk-Backend'
          format: 'XML'
          failOnCVSS: 7 # Dừng CI nếu tìm thấy lỗ hổng Nghiêm trọng/Rất cao
        
  # =========================================================
  # 2. BUILD AND PUSH JOB (Chỉ chạy khi Quality/Test OK)
  # =========================================================
  build-and-push:
    runs-on: ubuntu-latest
    needs: [quality-and-test] # CHỈ chạy nếu job kiểm tra chất lượng THÀNH CÔNG
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Cấp quyền thực thi cho Gradlew
        run: chmod +x gradlew
        
      # Bước này cần chạy lại để tạo file JAR sạch cho Docker Image
      - name: Build file JAR với Gradle (sạch)
        run: ./gradlew bootJar

      # --- 2.1 Build và Push Docker Image ------------------------
      - name: Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build và Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecowalk-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ecowalk-backend:${{ github.sha }}

      # --- 2.2 CD Security Check (Trivy Image Scan) --------------
      - name: 🐳 Quét Lỗ hổng Docker Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/ecowalk-backend:latest'
          format: 'table'
          exit-code: '1' # Thất bại nếu tìm thấy lỗi
          severity: 'HIGH,CRITICAL' # Chỉ kiểm tra lỗi nghiêm trọng/rất cao

      # --- 2.3 Trigger CD ---------------------------------------
      - name: Trigger Tekton CD Pipeline
        run: |
          curl -X POST http://${{ secrets.TEKTON_EL_URL }} \
            -H 'Content-Type: application/json' \
            -d '{"ref":"main","repository":{"url":"Hello"}}'
