name: CI Ecowalk Backend

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cấp quyền thực thi cho Gradlew
        run: chmod +x gradlew

      - name: Build file JAR với Gradle
        run: ./gradlew build -x test

      - name: Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build và Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Mình giữ tag v2 theo ý bạn và thêm tag commit SHA để Tekton dễ tracking
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecowalk-backend:v2
            ${{ secrets.DOCKERHUB_USERNAME }}/ecowalk-backend:${{ github.sha }}

      # Bước mới: Gửi HTTP Request đến Tekton EventListener
      - name: Trigger Tekton CD Pipeline
        run: |
          curl -X POST http://${{ secrets.TEKTON_EL_URL }} \
            -H "Content-Type: application/json" \
            -d '{
              "repo_url": "${{ github.event.repository.clone_url }}",
              "commit_sha": "${{ github.sha }}",
              "image": "${{ secrets.DOCKERHUB_USERNAME }}/ecowalk-backend:v2"
            }'
